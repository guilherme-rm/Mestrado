name: Tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install torch==2.2.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
          PYTHONDONTWRITEBYTECODE: '1'
